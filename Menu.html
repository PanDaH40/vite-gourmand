<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nos menus - Vite & Gourmand</title>

  <meta name="description" content="Découvrez les menus proposés par Vite & Gourmand pour vos repas, fêtes et événements à Bordeaux.">

  <link rel="stylesheet" href="asset/CSS/Menu.css">
</head>

<body>
  <header>
    <div class="container header-content">
      <h1 class="logo">Vite & Gourmand</h1>

      <nav aria-label="Navigation principale">
        <a href="PagePrincipale.html"> Accueil </a>

        <a href="Menu.html" class="active" aria-current="page"> Menus </a>

        <a href="Contact.html"> Contact </a>

        <a href="Connection.html"> Connexion </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- Titre de la page -->

    <section class="page-title">
      <h2>Nos menus</h2>

      <p class="muted">Découvrez nos propositions pour vos événements.</p>
    </section>

    <!-- Filtres -->

    <section class="filters">
      <h2>Filtres</h2>

      <form class="filters-form" id="filters-form">
        <div class="field">
          <label for="prix-min"> Prix minimum (€) </label>

          <input type="number" id="prix-min" min="0" step="1" placeholder="Ex : 100">
        </div>

        <div class="field">
          <label for="prix-max"> Prix maximum (€) </label>

          <input type="number" id="prix-max" min="0" step="1" placeholder="Ex : 300">
        </div>

        <div class="field">
          <label for="theme"> Thème </label>

          <select id="theme">
            <option value="">Tous</option>
            <option value="Pâques">Pâques</option>
            <option value="Noël">Noël</option>
            <option value="Classique">Classique</option>
          </select>
        </div>

        <div class="field">
          <label for="regime"> Régime </label>

          <select id="regime">
            <option value="">Tous</option>
            <option value="Classique">Classique</option>
            <option value="Végétarien">Végétarien</option>
            <option value="Vegan">Vegan</option>
          </select>
        </div>

        <div class="field">
          <label for="nb-min"> Nombre de personnes minimum </label>

          <input type="number" id="nb-min" min="1" step="1" placeholder="Ex : 6">
        </div>
      </form>
    </section>

    <!-- Résultats -->

    <section class="results">
      <h2>Menus disponibles</h2>

      <p id="result-count" class="muted" aria-live="polite">
        Chargement des menus...
      </p>

      <!-- Les menus provenant de MySQL sont ajoutés ici -->

      <div class="cards" id="cardsContainer">
        <p>Chargement des menus...</p>
      </div>
    </section>
  </main>

  <footer>
    <div class="container footer-content">
      <div>
        <strong>Horaires</strong>

        <p>Lundi - Dimanche : 08h00 - 20h00</p>
      </div>

      <nav aria-label="Informations légales">
        <a href="MentionLegale.html"> Mentions légales </a>

        <span aria-hidden="true"> | </span>

        <a href="CGV.html"> CGV </a>
      </nav>
    </div>
  </footer>

  <script src="asset/JS/Menu.js"></script>
  <script src="asset/JS/SessionFront.js"></script>
  <script src="asset/JS/MenuDynamique.js"></script>
</body>

</html>
