<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Mon profil - Vite & Gourmand</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="asset/CSS/Profil.css" />
  </head>

  <body>
    <header>
      <div class="container header-content">
        <h1 class="logo">Vite & Gourmand</h1>

        <nav aria-label="Navigation principale">
          <a href="PagePrincipale.html"> Accueil </a>

          <a href="Menu.html"> Menus </a>

          <a href="MesCommandes.html"> Mes commandes </a>

          <a href="Profil.html" class="active"> Mon profil </a>

          <a href="Contact.html"> Contact </a>

          <a href="Connection.html"> Connexion </a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="page-title">
        <h2>Mon profil</h2>

        <p>Consultez et modifiez vos informations personnelles.</p>
      </section>

      <section class="profile-layout">
        <!-- =========================
         INFORMATIONS PERSONNELLES
    ========================== -->

        <article class="profile-card">
          <h3>Informations personnelles</h3>

          <p id="messageProfil" role="status" aria-live="polite"></p>

          <form class="profile-form" id="profilForm">
            <div class="form-group">
              <label for="prenom"> Prénom </label>

              <input
                type="text"
                id="prenom"
                name="prenom"
                maxlength="50"
                required
              />
            </div>

            <div class="form-group">
              <label for="email"> Adresse mail </label>

              <input
                type="email"
                id="email"
                name="email"
                maxlength="50"
                required
              />
            </div>

            <div class="form-group">
              <label for="telephone"> Téléphone </label>

              <input
                type="tel"
                id="telephone"
                name="telephone"
                maxlength="50"
              />
            </div>

            <div class="form-group">
              <label for="adresse_postale"> Adresse postale </label>

              <input
                type="text"
                id="adresse_postale"
                name="adresse_postale"
                maxlength="50"
              />
            </div>

            <div class="form-group">
              <label for="ville"> Ville </label>

              <input type="text" id="ville" name="ville" maxlength="50" />
            </div>

            <div class="form-group">
              <label for="pays"> Pays </label>

              <input type="text" id="pays" name="pays" maxlength="50" />
            </div>

            <button type="submit" class="btn-primary">
              Enregistrer les modifications
            </button>
          </form>
        </article>

        <!-- =========================
         SÉCURITÉ
    ========================== -->

        <article class="profile-card">
          <h3>Sécurité</h3>

          <p id="messagePassword" role="status" aria-live="polite"></p>

          <form class="profile-form" id="passwordForm">
            <div class="form-group">
              <label for="current-password"> Mot de passe actuel </label>

              <input
                type="password"
                id="current-password"
                name="current-password"
                autocomplete="current-password"
                required
              />
            </div>

            <div class="form-group">
              <label for="new-password"> Nouveau mot de passe </label>

              <input
                type="password"
                id="new-password"
                name="new-password"
                autocomplete="new-password"
                required
              />
            </div>

            <div class="form-group">
              <label for="confirm-password"> Confirmer le mot de passe </label>

              <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                autocomplete="new-password"
                required
              />
            </div>

            <button type="submit" class="btn-primary">
              Modifier le mot de passe
            </button>
          </form>
        </article>
      </section>
    </main>

    <footer>
      <div class="container footer-content">
        <div>
          <strong> Horaires </strong>

          <p>Lundi - Dimanche : 08h00 - 20h00</p>
        </div>

        <div>
          <a href="MentionLegale.html"> Mentions légales </a>

          |

          <a href="CGV.html"> CGV </a>
        </div>
      </div>
    </footer>

    <script src="asset/JS/Profil.js"></script>
    <script src="asset/JS/SessionFront.js"></script>
  </body>
</html>
