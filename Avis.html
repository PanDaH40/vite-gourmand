<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Laisser un avis - Vite & Gourmand</title>

  <meta name="description" content="Partagez votre expérience avec Vite & Gourmand en laissant une note et un commentaire sur votre commande.">

  <link rel="stylesheet" href="asset/CSS/MesCommandes.css">
</head>

<body>

  <header>

    <div class="container header-content">

      <h1 class="logo">
        Vite & Gourmand
      </h1>

      <nav aria-label="Navigation principale">

        <a href="PagePrincipale.html">
          Accueil
        </a>

        <a href="Menu.html">
          Menus
        </a>

        <a href="MesCommandes.html">
          Mes commandes
        </a>

        <a href="Profil.html">
          Mon profil
        </a>

        <a href="Contact.html">
          Contact
        </a>

      </nav>

    </div>

  </header>


  <main class="container">

    <section class="page-title" aria-labelledby="avis-title">

      <h2 id="avis-title">
        Laisser un avis
      </h2>

      <p>
        Partagez votre expérience avec Vite & Gourmand.
      </p>

    </section>


    <section class="order-card" aria-labelledby="avis-form-title">

      <h3 id="avis-form-title">
        Votre avis
      </h3>

      <p id="commandeAvis" aria-live="polite"></p>

      <p id="messageAvis" role="status" aria-live="polite"></p>


      <form id="avisForm">

        <div class="form-group">

          <label for="note">
            Note
          </label>

          <select id="note" name="note" required>

            <option value="">
              Choisissez une note
            </option>

            <option value="5">
              5 / 5 - Excellent
            </option>

            <option value="4">
              4 / 5 - Très bien
            </option>

            <option value="3">
              3 / 5 - Bien
            </option>

            <option value="2">
              2 / 5 - Moyen
            </option>

            <option value="1">
              1 / 5 - Décevant
            </option>

          </select>

        </div>


        <div class="form-group">

          <label for="description">
            Votre commentaire
          </label>

          <textarea id="description" name="description" maxlength="50" rows="5" aria-describedby="description-help" required></textarea>

          <small id="description-help">
            50 caractères maximum.
          </small>

        </div>


        <button type="submit" class="btn-secondary">
          Envoyer mon avis
        </button>

      </form>

    </section>

  </main>


  <footer>

    <div class="container footer-content">

      <p>
        Vite & Gourmand
      </p>

      <nav aria-label="Informations légales">

        <a href="MentionLegale.html">
          Mentions légales
        </a>

        <span aria-hidden="true">
          |
        </span>

        <a href="CGV.html">
          CGV
        </a>

      </nav>

    </div>

  </footer>


  <script src="asset/JS/SessionFront.js"></script>
  <script src="asset/JS/Avis.js"></script>

</body>

</html>
